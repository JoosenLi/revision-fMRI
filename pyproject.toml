[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revision-fmri"
version = "0.1.0"
description = "Methodology-first interfaces for the Conwell 2024 LAION-fMRI reproduction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7", "numpy==1.26.4", "scipy==1.11.4", "scikit-learn==1.3.2"]
encoding = ["numpy==1.26.4", "scipy==1.11.4", "scikit-learn==1.3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

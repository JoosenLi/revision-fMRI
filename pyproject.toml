[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revision-fmri"
version = "0.1.0"
description = "Methodology-first interfaces for the Conwell 2024 LAION-fMRI reproduction"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7", "numpy==1.26.4", "scipy==1.11.4", "scikit-learn==1.3.2", "tqdm==4.67.1", "nibabel==5.2.1"]
data = ["nibabel==5.2.1"]
encoding = ["numpy==1.26.4", "scipy==1.11.4", "scikit-learn==1.3.2", "tqdm==4.67.1"]

[tool.setuptools.package-data]
"revision_fmri._vendor.deepnsd" = ["LICENSE", "SKLEARN_COPYING", "NOTICE.md", "manifest.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
